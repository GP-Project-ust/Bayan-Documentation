name: Build Thesis PDF

# Trigger on every push to main, on PRs, and allow manual runs.
on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.bib'
      - 'figures/**'
      - '.latexmkrc'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent builds from racing on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to push the built PDF back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #---------------------------------------------------------------------
      # Install Arabic fonts at the OS level (fontspec reads via fontconfig).
      #---------------------------------------------------------------------
      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-hosny-amiri \
            fonts-noto-core \
            fonts-noto-extra
          fc-cache -fv
          echo "=== Arabic fonts visible to fontspec ==="
          fc-list | grep -iE "amiri|naskh" | sort

      #---------------------------------------------------------------------
      # Build PDF with xu-cheng/latex-action.
      #
      # Why a dedicated action instead of apt-installed TeX Live:
      #   Ubuntu's texlive-lang-arabic (TL 2023) ships polyglossia v1.66,
      #   which predates the `bidi=basic` option (added in v1.67+, late
      #   2023). We need bidi=basic under LuaLaTeX to get clean Arabic
      #   text extraction (no reversed letters, no Presentation Forms).
      #   Debian's tlmgr cannot upgrade across TL major versions
      #   (2023 -> 2026) to install a newer polyglossia.
      #
      #   xu-cheng/latex-action installs TeX Live latest with working
      #   tlmgr and modern polyglossia (>= 1.67), and runs latexmk for us.
      #---------------------------------------------------------------------
      - name: Build PDF (LuaLaTeX via xu-cheng/latex-action)
        uses: xu-cheng/latex-action@v4
        with:
          latexmk_use_xelatex: false
          latexmk_use_lualatex: true
          root_file: main.tex
          pre_compile: |
            # Install Liberation Serif + DejaVu Sans Mono (not in texlive-alpine default)
            tlmgr install liberation dejavu
            echo "=== polyglossia version ==="
            kpsewhich polyglossia.sty
            grep -m1 'ProvidesPackage' "$(kpsewhich polyglossia.sty)" || true
            echo "=== Liberation Serif availability ==="
            fc-list | grep -iE "liberation|dejavu" | head -10 || true
            kpsewhich liberationserif-Regular.otf || true
            kpsewhich DejaVuSansMono.ttf || true

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== main.log (last 120 lines) ==="
          tail -n 120 main.log || true

      - name: Verify PDF was produced
        run: |
          test -f main.pdf
          echo "=== PDF info ==="
          pdfinfo main.pdf || true
          ls -la main.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-Thesis-PDF
          path: main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit built PDF back to the repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit."
          else
            git commit -m "chore(pdf): rebuild thesis PDF [skip ci]

            Auto-generated by GitHub Actions workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
