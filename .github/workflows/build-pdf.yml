name: Build Thesis PDF

# Trigger on every push to main, on PRs, and allow manual runs.
on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.bib'
      - 'figures/**'
      - '.latexmkrc'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent builds from racing on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to push the built PDF back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #---------------------------------------------------------------------
      # Install modern TeX Live via the official-ish action. We need
      # polyglossia >= 1.67 for the `bidi=basic` option (added late 2023),
      # but Ubuntu's texlive-lang-arabic ships v1.66 (TL 2023), and
      # Debian's tlmgr cannot upgrade across TeX Live major versions.
      # The teatimeguest action installs TeX Live 2024+ with working tlmgr.
      #---------------------------------------------------------------------
      - name: Install TeX Live (full, modern via tlmgr)
        uses: teatimeguest/setup-texlive-action@v3
        with:
          version: latest
          package: |
            scheme-full
            collection-langarabic
            collection-fontsrecommended
            collection-fontsextra
            collection-langeuropean
            collection-latexrecommended
            collection-latexextra
            collection-mathscience
            collection-luatex
            collection-bibtexextra
            collection-binextra
            latexmk

      - name: Install Arabic fonts (always)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-hosny-amiri \
            fonts-noto-core \
            fonts-noto-extra
          fc-cache -fv
          echo "=== Arabic fonts visible to fontspec ==="
          fc-list | grep -iE "amiri|naskh" | sort
          echo "=== polyglossia version ==="
          kpsewhich polyglossia.sty
          grep -m1 'ProvidesPackage' "$(kpsewhich polyglossia.sty)" || true

      - name: Build PDF (latexmk + LuaLaTeX, multiple passes for TOC/refs)
        run: |
          latexmk -lualatex -interaction=nonstopmode -file-line-error -halt-on-error main.tex

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== main.log (last 120 lines) ==="
          tail -n 120 main.log || true

      - name: Verify PDF was produced
        run: |
          test -f main.pdf
          echo "=== PDF info ==="
          pdfinfo main.pdf || true
          ls -la main.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-Thesis-PDF
          path: main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit built PDF back to the repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit."
          else
            git commit -m "chore(pdf): rebuild thesis PDF [skip ci]

            Auto-generated by GitHub Actions workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
