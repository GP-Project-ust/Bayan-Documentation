name: Build Thesis PDF

# Trigger on every push to main, on PRs, and allow manual runs.
on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.bib'
      - 'figures/**'
      - '.latexmkrc'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent builds from racing on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to push the built PDF back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live (LuaLaTeX + XeLaTeX) + Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-arabic \
            texlive-bibtex-extra \
            texlive-science \
            latexmk \
            fonts-hosny-amiri \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-cjk \
            python3-pygments \
            librsvg2-bin \
            poppler-utils

      - name: Refresh font cache
        run: |
          fc-cache -fv
          echo "=== Arabic fonts visible to fontspec ==="
          fc-list | grep -iE "amiri|naskh" | sort

      - name: Build PDF (latexmk + LuaLaTeX, multiple passes for TOC/refs)
        run: |
          # .latexmkrc now forces lualatex; we also pass -lualatex explicitly.
          # LuaLaTeX generates correct ToUnicode CMaps for Arabic fonts,
          # which fixes the garbled-copy-paste issue seen with XeTeX+Amiri.
          latexmk -lualatex -interaction=nonstopmode -file-line-error main.tex

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== main.log (last 120 lines) ==="
          tail -n 120 main.log || true

      - name: Verify PDF was produced
        run: |
          test -f main.pdf
          echo "=== PDF info ==="
          pdfinfo main.pdf || true
          ls -la main.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-Thesis-PDF
          path: main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit built PDF back to the repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit."
          else
            git commit -m "chore(pdf): rebuild thesis PDF [skip ci]

            Auto-generated by GitHub Actions workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi
